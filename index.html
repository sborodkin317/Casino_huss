<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HUSS CASINO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-gold: #ffcc00;
            --neon-red: #ff003c;
            --dark-bg: #0a0a0a;
            --card-bg: #1a1a1a;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--dark-bg);
            color: #fff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            user-select: none;
        }

        /* Экран приветствия */
        #welcome-screen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top, #2a0808 0%, #0a0a0a 70%);
        }
        
        .logo { font-size: 42px; font-weight: 900; margin: 0; line-height: 1; letter-spacing: 2px; text-align: center;}
        .text-huss { 
            color: var(--neon-gold);
            text-shadow: 0 0 10px var(--neon-gold), 0 0 30px #ff8800;
        }
        .text-casino { color: #fff; font-weight: 700; font-size: 28px; display: block; margin-top: 5px;}

        .enter-btn {
            margin-top: 50px;
            background: transparent;
            color: var(--neon-gold);
            border: 2px solid var(--neon-gold);
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(255,204,0,0.4);
            transition: 0.3s;
        }
        .enter-btn:active {
            background: var(--neon-gold);
            color: #000;
            box-shadow: 0 0 30px var(--neon-gold);
        }

        /* Главный экран */
        #main-app { display: none; padding: 20px; padding-bottom: 80px; }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-top: 10px;
        }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; background: var(--neon-gold); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #000; font-weight: 900; }
        .username { font-size: 14px; font-weight: 700; }

        .balance-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 204, 0, 0.3);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.1);
        }
        .balance-title { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .balance-amount { font-size: 36px; font-weight: 900; color: var(--neon-gold); text-shadow: 0 0 10px rgba(255, 204, 0, 0.5); }
        .balance-coin { font-size: 24px; }

        /* Сетка игр */
        .games-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .game-card {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .game-card:active { border-color: var(--neon-gold); transform: scale(0.98); }
        .game-icon { font-size: 40px; margin-bottom: 10px; }
        .game-title { font-size: 14px; font-weight: 700; }
        
        .game-card.locked { opacity: 0.5; }
        .game-card.locked .game-title::after { content: " 🔒"; }
    </style>
</head>
<body>

    <!-- Экран приветствия -->
    <div id="welcome-screen">
        <h1 class="logo"><span class="text-huss">HUSS</span><span class="text-casino">CASINO</span></h1>
        <button class="enter-btn" onclick="enterApp()">Войти в игру</button>
    </div>

    <!-- Главный экран -->
    <div id="main-app">
        <header>
            <div class="user-info">
                <div class="avatar" id="avatar-letter">H</div>
                <div class="username" id="username-display">Гость</div>
            </div>
        </header>

        <div class="balance-card">
            <div class="balance-title">Ваш баланс</div>
            <div class="balance-amount"><span id="balance-display">0</span> <span class="balance-coin">🪙</span></div>
        </div>

        <div class="games-grid">
            <div class="game-card" onclick="showAlert('Игра в разработке!')">
                <div class="game-icon">💣</div>
                <div class="game-title">Мины</div>
            </div>
            <div class="game-card" onclick="showAlert('Игра в разработке!')">
                <div class="game-icon">🚀</div>
                <div class="game-title">Ракетка</div>
            </div>
            <div class="game-card locked">
                <div class="game-icon">🎲</div>
                <div class="game-title">Кости</div>
            </div>
            <div class="game-card locked">
                <div class="game-icon">🎰</div>
                <div class="game-title">Слоты</div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        // Получаем данные пользователя из Telegram (если есть)
        let user = { id: 0, name: 'Гость', balance: 1000 };
        
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            user.id = tg.initDataUnsafe.user.id;
            user.name = tg.initDataUnsafe.user.first_name || 'Игрок';
            document.getElementById('username-display').innerText = user.name;
            document.getElementById('avatar-letter').innerText = user.name.charAt(0).toUpperCase();
        }

        // Заглушка для баланса (пока без базы данных)
        document.getElementById('balance-display').innerText = user.balance;

        function enterApp() {
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            if (tg) tg.HapticFeedback.impactOccurred('medium');
        }

        function showAlert(msg) {
            if (tg) tg.showAlert(msg); else alert(msg);
        }
    </script>
</body>
</html>
