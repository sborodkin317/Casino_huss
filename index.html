<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HUSS CASINO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-gold: #ffcc00;
            --neon-red: #ff003c;
            --neon-green: #00ff66;
            --dark-bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --cell-bg: #2a2a2a;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--dark-bg);
            color: #fff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* --- ЭКРАН ПРИВЕТСТВИЯ --- */
        #welcome-screen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top, #2a0808 0%, #0a0a0a 70%);
        }
        
        .logo { font-size: 42px; font-weight: 900; margin: 0; line-height: 1; letter-spacing: 2px; text-align: center;}
        .text-huss { color: var(--neon-gold); text-shadow: 0 0 10px var(--neon-gold), 0 0 30px #ff8800; }
        .text-casino { color: #fff; font-weight: 700; font-size: 28px; display: block; margin-top: 5px;}

        .enter-btn {
            margin-top: 50px;
            background: transparent;
            color: var(--neon-gold);
            border: 2px solid var(--neon-gold);
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(255,204,0,0.4);
            transition: 0.3s;
        }
        .enter-btn:active { background: var(--neon-gold); color: #000; box-shadow: 0 0 30px var(--neon-gold); }

        /* --- ГЛАВНЫЙ ЭКРАН --- */
        #main-app { display: none; padding: 20px; padding-bottom: 80px; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-top: 10px; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; background: var(--neon-gold); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #000; font-weight: 900; }
        .username { font-size: 14px; font-weight: 700; }

        .balance-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 204, 0, 0.3);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.1);
        }
        .balance-title { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .balance-amount { font-size: 32px; font-weight: 900; color: var(--neon-gold); text-shadow: 0 0 10px rgba(255, 204, 0, 0.5); }
        
        /* --- ЭКРАН ИГРЫ (МИНЫ) --- */
        #game-screen { display: none; }
        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .back-btn { background: none; border: none; color: #888; font-size: 14px; cursor: pointer; padding: 0; }
        .game-title-big { font-size: 20px; font-weight: 900; color: var(--neon-gold); }
        
        .game-controls {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }
        .bet-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .bet-input {
            flex: 1; padding: 12px; background: #000; border: 1px solid #444; border-radius: 8px; color: #fff; font-size: 16px; font-family: 'Montserrat'; text-align: center;
        }
        .play-btn {
            flex: 1; background: var(--neon-gold); color: #000; border: none; border-radius: 8px; font-weight: 900; font-size: 16px; cursor: pointer; text-transform: uppercase;
        }
        .cashout-btn {
            width: 100%; background: var(--neon-green); color: #000; border: none; border-radius: 8px; font-weight: 900; font-size: 16px; padding: 15px; cursor: pointer; text-transform: uppercase; display: none;
        }

        /* Сетка мин 5x5 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 0 auto;
            max-width: 400px;
        }
        .cell {
            aspect-ratio: 1 / 1;
            background: var(--cell-bg);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.05);
        }
        .cell:active { transform: scale(0.95); }
        .cell.revealed-gem { background: #1e3a2e; border: 1px solid var(--neon-green); box-shadow: 0 0 10px rgba(0,255,102,0.3); }
        .cell.revealed-bomb { background: #3a1e1e; border: 1px solid var(--neon-red); box-shadow: 0 0 10px rgba(255,0,60,0.5); }
        .cell.disabled { pointer-events: none; }
    </style>
</head>
<body>

    <!-- ЭКРАН ПРИВЕТСТВИЯ -->
    <div id="welcome-screen">
        <h1 class="logo"><span class="text-huss">HUSS</span><span class="text-casino">CASINO</span></h1>
        <button class="enter-btn" onclick="enterApp()">Войти в игру</button>
    </div>

    <!-- ГЛАВНЫЙ ЭКРАН (МЕНЮ) -->
    <div id="main-app">
        <header>
            <div class="user-info">
                <div class="avatar" id="avatar-letter">H</div>
                <div class="username" id="username-display">Гость</div>
            </div>
        </header>

        <div class="balance-card">
            <div class="balance-title">Ваш баланс</div>
            <div class="balance-amount"><span id="balance-display">0</span> <span style="font-size:24px;">🪙</span></div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="game-card" onclick="openMines()" style="background: var(--card-bg); border: 1px solid #333; border-radius: 16px; padding: 20px; text-align: center; cursor: pointer;">
                <div style="font-size: 40px; margin-bottom: 10px;">💣</div>
                <div style="font-size: 14px; font-weight: 700;">Мины</div>
            </div>
            <div class="game-card" onclick="showAlert('В разработке!')" style="background: var(--card-bg); border: 1px solid #333; border-radius: 16px; padding: 20px; text-align: center; cursor: pointer; opacity: 0.5;">
                <div style="font-size: 40px; margin-bottom: 10px;">🚀</div>
                <div style="font-size: 14px; font-weight: 700;">Ракетка</div>
            </div>
        </div>
    </div>

    <!-- ЭКРАН ИГРЫ "МИНЫ" -->
    <div id="game-screen">
        <div class="game-header">
            <button class="back-btn" onclick="goBack()">← Назад</button>
            <div class="game-title-big">МИНЫ</div>
            <div style="font-size: 14px; font-weight: 700; color: var(--neon-gold);"><span id="game-balance">0</span> 🪙</div>
        </div>

        <div class="game-controls">
            <div class="bet-row" id="bet-row">
                <input type="number" id="bet-input" class="bet-input" value="100" min="10">
                <button class="play-btn" id="play-btn" onclick="startGame()">Играть</button>
            </div>
            
            <div style="text-align: center; margin-bottom: 10px; font-size: 14px;" id="status-text">
                Сделай ставку и нажми «Играть»
            </div>
            
            <div style="text-align: center; margin-bottom: 10px; font-weight: 900; font-size: 20px; color: var(--neon-green); display: none;" id="multiplier-display">
                x<span id="multiplier-val">1.00</span>
            </div>

            <button class="cashout-btn" id="cashout-btn" onclick="cashOut()">
                Забрать <span id="cashout-val">0</span> 🪙
            </button>
        </div>

        <div class="grid-container" id="grid"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        // --- СОСТОЯНИЕ ИГРЫ ---
        let balance = 1000; // Стартовый баланс
        let currentBet = 0;
        let minesCount = 3; // Количество мин на поле
        let mines = [];
        let revealedCells = 0;
        let isPlaying = false;
        let currentMultiplier = 1.0;
        let safeCellsTotal = 25 - minesCount;

        // Инициализация пользователя
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const name = tg.initDataUnsafe.user.first_name || 'Игрок';
            document.getElementById('username-display').innerText = name;
            document.getElementById('avatar-letter').innerText = name.charAt(0).toUpperCase();
        }

        function updateBalanceUI() {
            document.getElementById('balance-display').innerText = balance;
            document.getElementById('game-balance').innerText = balance;
        }

        function enterApp() {
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            updateBalanceUI();
            if (tg) tg.HapticFeedback.impactOccurred('medium');
        }

        function showAlert(msg) {
            if (tg) tg.showAlert(msg); else alert(msg);
        }

        // --- ЛОГИКА МИН ---
        function openMines() {
            document.getElementById('main-app').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('bet-input').value = 100;
            resetGameBoard();
        }

        function goBack() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            resetGameBoard();
        }

        // Создание/пересоздание поля
        function createGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.index = i;
                cell.onclick = () => clickCell(i, cell);
                grid.appendChild(cell);
            }
        }

        function resetGameBoard() {
            isPlaying = false;
            revealedCells = 0;
            currentMultiplier = 1.0;
            
            document.getElementById('bet-row').style.display = 'flex';
            document.getElementById('cashout-btn').style.display = 'none';
            document.getElementById('multiplier-display').style.display = 'none';
            document.getElementById('status-text').innerText = "Сделай ставку и нажми «Играть»";
            document.getElementById('status-text').style.color = "#fff";
            
            createGrid();
        }

        function startGame() {
            const bet = parseInt(document.getElementById('bet-input').value);
            if (isNaN(bet) || bet < 10) return showAlert('Минимальная ставка 10 монет!');
            if (bet > balance) return showAlert('Недостаточно средств!');

            // Списываем ставку
            balance -= bet;
            currentBet = bet;
            updateBalanceUI();

            // Генерируем мины
            mines = [];
            while (mines.length < minesCount) {
                const r = Math.floor(Math.random() * 25);
                if (!mines.includes(r)) mines.push(r);
            }

            // Включаем режим игры
            isPlaying = true;
            revealedCells = 0;
            currentMultiplier = 1.0;

            // Обновляем кнопки
            document.getElementById('bet-row').style.display = 'none';
            document.getElementById('cashout-btn').style.display = 'block';
            document.getElementById('multiplier-display').style.display = 'block';
            document.getElementById('status-text').innerText = "Открывай клетки и не попади на мину!";
            document.getElementById('status-text').style.color = "#fff";
            document.getElementById('cashout-val').innerText = currentBet;
            document.getElementById('multiplier-val').innerText = currentMultiplier.toFixed(2);

            // Создаем новое чистое поле
            createGrid(); 
        }

        function clickCell(index, cellElement) {
            if (!isPlaying || cellElement.classList.contains('disabled')) return;

            if (mines.includes(index)) {
                // ПОПАЛ НА МИНУ
                cellElement.classList.add('revealed-bomb', 'disabled');
                cellElement.innerText = '💣';
                gameOver();
            } else {
                // БЕЗОПАСНАЯ КЛЕТКА
                cellElement.classList.add('revealed-gem', 'disabled');
                cellElement.innerText = '💎';
                revealedCells++;

                // Пересчет множителя
                currentMultiplier = 1 + (revealedCells * 0.15) + (Math.pow(revealedCells, 1.5) * 0.05);
                
                const cashVal = Math.floor(currentBet * currentMultiplier);
                document.getElementById('multiplier-val').innerText = currentMultiplier.toFixed(2);
                document.getElementById('cashout-val').innerText = cashVal;
                if (tg) tg.HapticFeedback.impactOccurred('light');

                // Если открыли все безопасные клетки
                if (revealedCells === safeCellsTotal) {
                    cashOut();
                }
            }
        }

        function gameOver() {
            isPlaying = false;
            if (tg) tg.HapticFeedback.notificationOccurred('error');
            
            // Показываем все мины
            const cells = document.querySelectorAll('.cell');
            cells.forEach(c => {
                const idx = parseInt(c.dataset.index);
                if (mines.includes(idx) && c.innerText !== '💣') {
                    c.classList.add('revealed-bomb');
                    c.innerText = '💣';
                }
                c.classList.add('disabled');
            });

            document.getElementById('status-text').innerText = "Вы подорвались!";
            document.getElementById('status-text').style.color = "var(--neon-red)";
            document.getElementById('cashout-btn').style.display = 'none';
            
            setTimeout(() => {
                resetGameBoard();
            }, 2500);
        }

        function cashOut() {
            if (!isPlaying || revealedCells === 0) return;
            
            isPlaying = false;
            const winAmount = Math.floor(currentBet * currentMultiplier);
            balance += winAmount;
            updateBalanceUI();

            if (tg) tg.HapticFeedback.notificationOccurred('success');
            document.getElementById('status-text').innerText = `Вы выиграли ${winAmount} монет!`;
            document.getElementById('status-text').style.color = "var(--neon-green)";
            document.getElementById('cashout-btn').style.display = 'none';

            setTimeout(() => {
                resetGameBoard();
            }, 2500);
        }
    </script>
</body>
</html>
